name: EPUB y LuaLaTeX del atlas

# Genera automáticamente EPUB, PDF y fuente LuaLaTeX autocontenida cuando
# cambia main. Los binarios no viven en git: cada ejecución los publica como
# artifact descargable, y los releases además los reciben como assets.
#
# CONTRATO CON scripts/epub.py
# Este workflow define la interfaz que debe cumplir el generador:
#   · se invoca como `python scripts/epub.py --salida <ruta>`
#   · deja el archivo exactamente en esa ruta
#   · sale con código != 0 si algo falló, incluida su propia validación
# Si el generador cambia de toolchain, hay que actualizar el paso «Instalar
# dependencias del sistema» de aquí abajo. Esa actualización es parte del
# trabajo de quien cambie el generador.
#
# MOTOR DE RENDER
# El manuscrito lo proyecta `scripts/qmd.py` a un proyecto Quarto book en
# build/quarto/. `epub.py` prefiere `quarto` y cae a `pandoc` sobre el
# manuscrito plano equivalente si no lo encuentra. Aquí se instalan los dos a
# propósito: si la instalación de Quarto falla, el EPUB igual se produce y la
# validación editorial sigue siendo la misma.
#
# AVISO SOBRE ZENODO
# La integración de Zenodo con GitHub archiva el SNAPSHOT DEL REPOSITORIO al
# crear el release, no los assets. El .epub adjunto aquí NO entra solo en el
# registro de Zenodo: para que el ePub quede dentro del DOI hay que subirlo al
# registro (a mano o vía API). Lo que sí queda archivado y citable es la fuente
# que lo genera, que es reproducible por diseño.

on: workflow_dispatch

permissions:
  contents: read
  actions: read

concurrency:
  group: editorial-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  epub:
    name: Generar EPUB, PDF y fuente LuaLaTeX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 206f41914e8eab858c2105e608267f2a22bf6e09
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Instalar dependencias de Python
        run: pip install -r requirements.txt

      - name: Comprobar que el generador existe
        # Falla con un mensaje accionable en vez de un ModuleNotFound críptico.
        run: |
          if [ ! -f scripts/epub.py ]; then
            echo "::error::Falta scripts/epub.py."
            echo "El generador de ePub todavía no está en el repositorio."
            echo "Interfaz esperada: python scripts/epub.py --salida build/atlas.epub"
            exit 1
          fi

      - name: Instalar dependencias del sistema
        # Pandoc genera el EPUB y LuaLaTeX compila el libro con las mismas
        # imágenes declaradas en `archivo_local`.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pandoc fonts-freefont-ttf default-jre-headless librsvg2-bin \
            texlive-latex-recommended texlive-latex-extra \
            texlive-bibtex-extra texlive-lang-spanish texlive-luatex
          echo "pandoc: $(pandoc --version | head -1)"
          # rsvg-convert rasteriza la portada: Kindle no admite portadas SVG
          # y Calibre no puede extraerlas sin motor de navegador.
          echo "rsvg-convert: $(rsvg-convert --version)"
          echo "lualatex: $(lualatex --version | head -1)"

      - name: Instalar Libertinus
        # Fuente del libro impreso (serif, sans y display; cubre ≥ → ±).
        # Ubuntu 24.04 no la empaqueta: se fija la versión, como epubcheck.
        run: |
          VER=7.051
          curl -fsSL -o /tmp/libertinus.zip \
            "https://github.com/alerque/libertinus/releases/download/v${VER}/Libertinus-${VER}.zip"
          unzip -q /tmp/libertinus.zip -d /tmp/libertinus
          mkdir -p ~/.local/share/fonts
          find /tmp/libertinus -name 'Libertinus*.otf' -exec cp {} ~/.local/share/fonts/ \;
          fc-cache -f
          for familia in "Libertinus Serif" "Libertinus Sans" "Libertinus Serif Display"; do
            fc-list | grep -q "$familia" || { echo "::error::Falta la fuente $familia"; exit 1; }
          done

      - name: Instalar Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.5.57

      - name: Instalar epubcheck
        run: |
          VER=5.1.0
          curl -fsSL -o /tmp/epubcheck.zip \
            "https://github.com/w3c/epubcheck/releases/download/v${VER}/epubcheck-${VER}.zip"
          unzip -q /tmp/epubcheck.zip -d /opt
          echo "EPUBCHECK_JAR=/opt/epubcheck-${VER}/epubcheck.jar" >> "$GITHUB_ENV"

      - name: Renderizar y auditar el prólogo íntegro
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get install -y --no-install-recommends poppler-utils
          out="$GITHUB_WORKSPACE/build/auditoria-prologo"
          mkdir -p "$out" "$RUNNER_TEMP/motor-audit"
          gh run download 42412636969 --repo "$GITHUB_REPOSITORY" --name auditoria-silabacion-pdf --dir "$RUNNER_TEMP/base-pdf"
          cp "$RUNNER_TEMP/base-pdf/despues.pdf" "$out/antes.pdf"
          cp "$RUNNER_TEMP/base-pdf/despues.log" "$out/antes.log"
          cp "$RUNNER_TEMP/base-pdf/despues.tex" "$out/antes.tex"
          export AUDIT_MOTOR_REAL AUDIT_LOG
          AUDIT_MOTOR_REAL=$(command -v lualatex)
          AUDIT_LOG="$out/despues.log"
          cat > "$RUNNER_TEMP/motor-audit/lualatex" <<'SH'
          #!/usr/bin/env bash
          "$AUDIT_MOTOR_REAL" "$@"
          status=$?
          log=$(find "$PWD" -maxdepth 4 -type f -name '*.log' -printf '%T@ %p\n' \
            | sort -nr | head -n 1 | cut -d ' ' -f 2-)
          if [ -n "$log" ]; then cp "$log" "$AUDIT_LOG"; fi
          exit "$status"
          SH
          chmod +x "$RUNNER_TEMP/motor-audit/lualatex"
          export PATH="$RUNNER_TEMP/motor-audit:$PATH"
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import sys

          sys.path.insert(0,'scripts')
          import banco, qmd, epub, libro

          original=Path('paratextos/prologo.md').read_bytes()
          assert sha256(original).hexdigest()=='ce585c2cc796c83f36224a738edf955b3a47bda8727e2b3e1681f8aca1da5211'
          assert qmd.prologo(Path.cwd()).encode('utf-8')==original
          qmd.compilacion_git=lambda _: ('auditoria-silabacion',{'SOURCE_DATE_EPOCH':'1794081295','TZ':'UTC'})
          sys.argv=['epub.py','--solo-publicados','--salida','build/auditoria-prologo/despues.epub']
          assert epub.main()==0
          sys.argv=['libro.py','--solo-publicados','--salida','build/auditoria-prologo/despues.pdf']
          assert libro.main()==0
          assert Path('build/quarto/prologo.qmd').read_bytes()==original
          es=banco.seleccionar_edicion(banco.cargar(Path.cwd()),qmd.FECHA_CORTE)
          assert len(es)==56
          PY
          cp build/quarto/libro.tex "$out/despues.tex"
          cp build/quarto/_quarto.yml "$out/proyecto.yml"
          python - <<'PY'
          from collections import Counter
          from pathlib import Path, PurePosixPath
          from xml.etree import ElementTree as ET
          import json, re, subprocess, zipfile

          out=Path('build/auditoria-prologo')
          report={'fichas':56,'fecha_corte':'2026-11-13'}
          warning=re.compile(r'^(Overfull|Underfull) \\([hv])box[^\n]*',re.M)
          for scenario in ('antes','despues'):
              info=subprocess.check_output(['pdfinfo',str(out/f'{scenario}.pdf')],text=True)
              pages=int(re.search(r'^Pages:\s+(\d+)',info,re.M)[1])
              log=(out/f'{scenario}.log').read_text(encoding='utf-8',errors='replace')
              tex=(out/f'{scenario}.tex').read_text(encoding='utf-8').splitlines()
              counters=Counter()
              records=[]
              for m in warning.finditer(log):
                  counters[f'{m[1]} {m[2]}box']+=1
                  end=log.find('\n\n',m.end())
                  record=log[m.start():end if end>=0 else m.end()]
                  source=re.search(r'at lines? (\d+)(?:--(\d+))?',m[0])
                  context=''
                  if source:
                      lo,hi=int(source[1]),int(source[2] or source[1])
                      context='\n'.join(tex[max(0,lo-2):hi+1])
                  records.append({'aviso':m[0],'fragmento_log':record,'fuente_tex':context})
              report[scenario]={'paginas':pages,'cajas':dict(counters)}
              (out/f'cajas-{scenario}.json').write_text(json.dumps(records,ensure_ascii=False,indent=2)+'\n')
          text=subprocess.check_output(['pdftotext','-enc','UTF-8','-layout',str(out/'despues.pdf'),'-'],text=True)
          pages=text.split('\f')[:report['despues']['paginas']]
          (out/'despues.txt').write_text(text,encoding='utf-8')
          prologue_start=[i for i,p in enumerate(pages,1) if 'Por circunstancias de la vida' in ' '.join(p.split())]
          prologue_end=[i for i,p in enumerate(pages,1) if 'Médico mastólogo' in ' '.join(p.split())]
          assert len(prologue_start)==len(prologue_end)==1
          start,end=prologue_start[0],prologue_end[0]
          report['prologo']={'pagina_fisica_inicio':start,'pagina_fisica_fin':end,'paginas_ocupadas':end-start+1,
                            'entrada_en_indice':[i for i,p in enumerate(pages[:start-1],1) if 'PRÓLOGO' in p]}
          assert report['prologo']['entrada_en_indice'], 'Falta el prólogo en el índice PDF'
          assert pages[start-1].count('PRÓLOGO')>=1
          for page in range(start,end+1):
              subprocess.run(['pdftoppm','-f',str(page),'-l',str(page),'-r','125','-png','-singlefile',
                              str(out/'despues.pdf'),str(out/f'prologo-{page}')],check=True)
          with zipfile.ZipFile(out/'despues.epub') as z:
              container=ET.fromstring(z.read('META-INF/container.xml'))
              opf_path=container.find('.//{*}rootfile').get('full-path')
              opf=ET.fromstring(z.read(opf_path))
              root=PurePosixPath(opf_path).parent
              manifest={e.get('id'):e for e in opf.find('{*}manifest')}
              spine=[]
              for n,e in enumerate(opf.find('{*}spine'),1):
                  item=manifest[e.get('idref')]
                  path=str(root/item.get('href'))
                  html=ET.fromstring(z.read(path))
                  headings=[' '.join(''.join(h.itertext()).split()) for h in html.iter()
                            if h.tag.split('}')[-1] in ('h1','h2','h3')]
                  spine.append({'posicion':n,'href':item.get('href'),'encabezados':headings[:4],
                                'tiene_prologo':'Por circunstancias de la vida' in ' '.join(''.join(html.itertext()).split())})
              report['epub_spine']=spine
              assert sum(s['tiene_prologo'] for s in spine)==1
              nav=next(e for e in manifest.values() if 'nav' in e.get('properties','').split())
              navxml=ET.fromstring(z.read(str(root/nav.get('href'))))
              report['prologo']['epub_en_navegacion']=any('PRÓLOGO' in ''.join(a.itertext()) for a in navxml.iter() if a.tag.endswith('}a'))
              assert report['prologo']['epub_en_navegacion']
          (out/'resultado.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY

      - name: Conservar evidencia del prólogo
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: auditoria-prologo
          path: build/auditoria-prologo/
          retention-days: 30
