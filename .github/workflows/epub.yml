name: EPUB y LuaLaTeX del atlas

# Genera automáticamente EPUB, PDF y fuente LuaLaTeX autocontenida cuando
# cambia main. Los binarios no viven en git: cada ejecución los publica como
# artifact descargable, y los releases además los reciben como assets.
#
# CONTRATO CON scripts/epub.py
# Este workflow define la interfaz que debe cumplir el generador:
#   · se invoca como `python scripts/epub.py --salida <ruta>`
#   · deja el archivo exactamente en esa ruta
#   · sale con código != 0 si algo falló, incluida su propia validación
# Si el generador cambia de toolchain (pandoc → tex4ebook, etc.), hay que
# actualizar el paso «Instalar dependencias del sistema» de aquí abajo. Esa
# actualización es parte del trabajo de quien cambie el generador.
#
# AVISO SOBRE ZENODO
# La integración de Zenodo con GitHub archiva el SNAPSHOT DEL REPOSITORIO al
# crear el release, no los assets. El .epub adjunto aquí NO entra solo en el
# registro de Zenodo: para que el ePub quede dentro del DOI hay que subirlo al
# registro (a mano o vía API). Lo que sí queda archivado y citable es la fuente
# que lo genera, que es reproducible por diseño.

on:
  push:
    branches: [main]
    paths:
      - 'conceptos/**'
      - 'signos/**'
      - 'casos/**'
      - 'assets/img/**'
      - 'scripts/build.py'
      - 'scripts/epub.py'
      - 'scripts/indice.py'
      - 'scripts/paquete_latex.py'
      - 'scripts/verificar_publicacion.py'
      - 'build/index.json'
      - 'refs.bib'
      - '.github/workflows/epub.yml'
  pull_request:
    paths:
      - 'conceptos/**'
      - 'signos/**'
      - 'casos/**'
      - 'assets/img/**'
      - 'scripts/build.py'
      - 'scripts/epub.py'
      - 'scripts/indice.py'
      - 'scripts/paquete_latex.py'
      - 'scripts/verificar_publicacion.py'
      - 'build/index.json'
      - 'refs.bib'
      - '.github/workflows/epub.yml'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      solo_publicados:
        description: 'Incluir solo fichas con URL de Ghost'
        type: boolean
        default: true

permissions:
  contents: write   # necesario para adjuntar el asset al release

concurrency:
  group: editorial-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  epub:
    name: Generar EPUB, PDF y fuente LuaLaTeX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar dependencias de Python
        run: pip install pyyaml

      - name: Comprobar que el generador existe
        # Falla con un mensaje accionable en vez de un ModuleNotFound críptico.
        run: |
          if [ ! -f scripts/epub.py ]; then
            echo "::error::Falta scripts/epub.py."
            echo "El generador de ePub todavía no está en el repositorio."
            echo "Interfaz esperada: python scripts/epub.py --salida build/atlas.epub"
            exit 1
          fi

      - name: Instalar dependencias del sistema
        # Pandoc genera el EPUB y LuaLaTeX compila el libro con las mismas
        # imágenes declaradas en `archivo_local`.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pandoc fonts-freefont-ttf default-jre-headless biber \
            texlive-latex-recommended texlive-latex-extra \
            texlive-bibtex-extra texlive-lang-spanish texlive-luatex
          echo "pandoc: $(pandoc --version | head -1)"
          echo "lualatex: $(lualatex --version | head -1)"

      - name: Instalar epubcheck
        run: |
          VER=5.1.0
          curl -fsSL -o /tmp/epubcheck.zip \
            "https://github.com/w3c/epubcheck/releases/download/v${VER}/epubcheck-${VER}.zip"
          unzip -q /tmp/epubcheck.zip -d /opt
          echo "EPUBCHECK_JAR=/opt/epubcheck-${VER}/epubcheck.jar" >> "$GITHUB_ENV"

      - name: Compilar el banco
        # indice.py se ejecuta aquí solo como comprobación reproducible: el PR
        # proveedor sigue siendo el único que versiona build/index.json.
        run: |
          python scripts/build.py
          python scripts/indice.py .
          if ! git diff --quiet -- build/index.json; then
            echo "::error::build/index.json está desactualizado."
            exit 1
          fi

      - name: Verificar coherencia de publicación
        # Un release no puede empaquetar URLs o medios más nuevos que el índice.
        # Este guardián también valida el mapa y las imágenes destacadas.
        run: python scripts/verificar_publicacion.py --verificar-derivados

      - name: Compilar el libro con LuaLaTeX
        working-directory: build
        run: |
          lualatex -halt-on-error -interaction=nonstopmode libro.tex
          biber libro
          lualatex -halt-on-error -interaction=nonstopmode libro.tex
          lualatex -halt-on-error -interaction=nonstopmode libro.tex
          test -s libro.pdf || { echo "::error::No se generó build/libro.pdf"; exit 1; }

      - name: Empaquetar fuente LuaLaTeX con todos los assets
        run: |
          python scripts/paquete_latex.py --salida build/biosemiotics-latex.zip
          test -s build/biosemiotics-latex.zip || { echo "::error::No se generó el ZIP LaTeX"; exit 1; }

      - name: Generar el ePub
        run: |
          ARGS=()
          # Los releases son ediciones citables: solo incluyen fichas que ya
          # pasaron por la revisión editorial de Ghost. En una ejecución manual
          # se puede desactivar la bandera para probar una edición futura.
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] || [ "${{ inputs.solo_publicados }}" = "true" ]; then
            ARGS+=(--solo-publicados)
          fi
          python scripts/epub.py --salida build/atlas.epub "${ARGS[@]}"

      - name: Verificar imágenes dentro del EPUB
        run: python scripts/verificar_publicacion.py --verificar-derivados --epub build/atlas.epub

      - name: Comprobar que el artefacto es real
        # Un ePub de pocos KB casi siempre significa "se generó vacío".
        run: |
          test -f build/atlas.epub || { echo "::error::No se generó build/atlas.epub"; exit 1; }
          BYTES=$(stat -c%s build/atlas.epub)
          echo "Tamaño: $((BYTES / 1024)) KB"
          if [ "$BYTES" -lt 51200 ]; then
            echo "::error::build/atlas.epub pesa $((BYTES / 1024)) KB: sospechosamente vacío."
            exit 1
          fi

      - name: Validar con epubcheck
        run: java -jar "$EPUBCHECK_JAR" build/atlas.epub

      - name: Adjuntar al release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${{ github.event.release.tag_name }}"
          build/atlas.epub build/libro.tex build/libro.pdf
          build/biosemiotics-latex.zip --clobber

      - name: Publicar derivados como artifact
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: atlas-epub-latex
          path: |
            build/atlas.epub
            build/libro.tex
            build/libro.pdf
            build/biosemiotics-latex.zip
          retention-days: 90
