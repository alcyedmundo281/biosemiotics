name: EPUB y LuaLaTeX del atlas

# Genera automáticamente EPUB, PDF y fuente LuaLaTeX autocontenida cuando
# cambia main. Los binarios no viven en git: cada ejecución los publica como
# artifact descargable, y los releases además los reciben como assets.
#
# CONTRATO CON scripts/epub.py
# Este workflow define la interfaz que debe cumplir el generador:
#   · se invoca como `python scripts/epub.py --salida <ruta>`
#   · deja el archivo exactamente en esa ruta
#   · sale con código != 0 si algo falló, incluida su propia validación
# Si el generador cambia de toolchain, hay que actualizar el paso «Instalar
# dependencias del sistema» de aquí abajo. Esa actualización es parte del
# trabajo de quien cambie el generador.
#
# MOTOR DE RENDER
# El manuscrito lo proyecta `scripts/qmd.py` a un proyecto Quarto book en
# build/quarto/. `epub.py` prefiere `quarto` y cae a `pandoc` sobre el
# manuscrito plano equivalente si no lo encuentra. Aquí se instalan los dos a
# propósito: si la instalación de Quarto falla, el EPUB igual se produce y la
# validación editorial sigue siendo la misma.
#
# AVISO SOBRE ZENODO
# La integración de Zenodo con GitHub archiva el SNAPSHOT DEL REPOSITORIO al
# crear el release, no los assets. El .epub adjunto aquí NO entra solo en el
# registro de Zenodo: para que el ePub quede dentro del DOI hay que subirlo al
# registro (a mano o vía API). Lo que sí queda archivado y citable es la fuente
# que lo genera, que es reproducible por diseño.

on: workflow_dispatch

permissions:
  contents: read

concurrency:
  group: editorial-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  epub:
    name: Generar EPUB, PDF y fuente LuaLaTeX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: c5ca8e38956d14bde887fc207fdfea53dfae41b6
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Instalar dependencias de Python
        run: pip install -r requirements.txt

      - name: Comprobar que el generador existe
        # Falla con un mensaje accionable en vez de un ModuleNotFound críptico.
        run: |
          if [ ! -f scripts/epub.py ]; then
            echo "::error::Falta scripts/epub.py."
            echo "El generador de ePub todavía no está en el repositorio."
            echo "Interfaz esperada: python scripts/epub.py --salida build/atlas.epub"
            exit 1
          fi

      - name: Instalar dependencias del sistema
        # Pandoc genera el EPUB y LuaLaTeX compila el libro con las mismas
        # imágenes declaradas en `archivo_local`.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pandoc fonts-freefont-ttf default-jre-headless librsvg2-bin \
            texlive-latex-recommended texlive-latex-extra \
            texlive-bibtex-extra texlive-lang-spanish texlive-luatex
          echo "pandoc: $(pandoc --version | head -1)"
          # rsvg-convert rasteriza la portada: Kindle no admite portadas SVG
          # y Calibre no puede extraerlas sin motor de navegador.
          echo "rsvg-convert: $(rsvg-convert --version)"
          echo "lualatex: $(lualatex --version | head -1)"

      - name: Instalar Libertinus
        # Fuente del libro impreso (serif, sans y display; cubre ≥ → ±).
        # Ubuntu 24.04 no la empaqueta: se fija la versión, como epubcheck.
        run: |
          VER=7.051
          curl -fsSL -o /tmp/libertinus.zip \
            "https://github.com/alerque/libertinus/releases/download/v${VER}/Libertinus-${VER}.zip"
          unzip -q /tmp/libertinus.zip -d /tmp/libertinus
          mkdir -p ~/.local/share/fonts
          find /tmp/libertinus -name 'Libertinus*.otf' -exec cp {} ~/.local/share/fonts/ \;
          fc-cache -f
          for familia in "Libertinus Serif" "Libertinus Sans" "Libertinus Serif Display"; do
            fc-list | grep -q "$familia" || { echo "::error::Falta la fuente $familia"; exit 1; }
          done

      - name: Instalar Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.5.57

      - name: Instalar epubcheck
        run: |
          VER=5.1.0
          curl -fsSL -o /tmp/epubcheck.zip \
            "https://github.com/w3c/epubcheck/releases/download/v${VER}/epubcheck-${VER}.zip"
          unzip -q /tmp/epubcheck.zip -d /opt
          echo "EPUBCHECK_JAR=/opt/epubcheck-${VER}/epubcheck.jar" >> "$GITHUB_ENV"

      - name: Compilar ambos PDF y conservar el log final
        run: |
          sudo apt-get install -y --no-install-recommends poppler-utils
          base=eda169d57ad44dfbaa0e4b410c2505a84b9dbae2
          git fetch --no-tags --depth=1 origin "$base"
          export AUDIT_QUARTO_REAL
          AUDIT_QUARTO_REAL=$(command -v quarto)
          mkdir -p "$RUNNER_TEMP/quarto-audit"
          cat > "$RUNNER_TEMP/quarto-audit/quarto" <<'SH'
          #!/usr/bin/env bash
          if [ "$1" = render ]; then
            exec "$AUDIT_QUARTO_REAL" "$@" --metadata latex-clean:false
          fi
          exec "$AUDIT_QUARTO_REAL" "$@"
          SH
          chmod +x "$RUNNER_TEMP/quarto-audit/quarto"
          export PATH="$RUNNER_TEMP/quarto-audit:$PATH"
          out="$GITHUB_WORKSPACE/build/auditoria-silabacion"
          mkdir -p "$out"
          for modo in antes despues; do
            if [ "$modo" = antes ]; then ref="$base"; else ref=$(git rev-parse HEAD); fi
            checkout="$RUNNER_TEMP/silabacion-$modo"
            git worktree add --detach "$checkout" "$ref"
            (
              cd "$checkout"
              python -c 'import sys; sys.path.insert(0,"scripts"); import qmd, libro; qmd.compilacion_git = lambda _: ("auditoria-silabacion", {"SOURCE_DATE_EPOCH":"1794081295","TZ":"UTC"}); sys.argv=["libro.py","--solo-publicados","--salida","build/libro.pdf"]; raise SystemExit(libro.main())'
            )
            log=$(find "$checkout/build/quarto" -type f -name libro.log -print -quit)
            test -n "$log"
            cp "$log" "$out/$modo.log"
            cp "$checkout/build/quarto/libro.tex" "$out/$modo.tex"
            cp "$checkout/build/libro.pdf" "$out/$modo.pdf"
            pdfinfo "$out/$modo.pdf" | grep -E '^(Pages:|Page size:|Producer:)'
          done

      - name: Inventariar las cajas y comparar las páginas
        run: |
          python - <<'PY'
          from collections import Counter
          from concurrent.futures import ThreadPoolExecutor
          from hashlib import sha256
          import json
          from pathlib import Path
          import re
          import subprocess
          import tempfile

          out = Path('build/auditoria-silabacion')
          warning = re.compile(r'^(Overfull|Underfull) \\([hv])box[^\n]*', re.M)
          report = {}
          for modo in ('antes', 'despues'):
              pdf = out / f'{modo}.pdf'
              log = (out / f'{modo}.log').read_text(encoding='utf-8', errors='replace')
              tex = (out / f'{modo}.tex').read_text(encoding='utf-8').splitlines()
              info = subprocess.check_output(['pdfinfo', str(pdf)], text=True)
              count = int(re.search(r'^Pages:\s+(\d+)', info, re.M)[1])
              stats = Counter()
              complete = []
              target = []
              for match in warning.finditer(log):
                  stats[f'{match[1]} {match[2]}box'] += 1
                  end = log.find('\n\n', match.end())
                  record = log[match.start(): end if end >= 0 else match.end()].strip()
                  span = re.search(r'at lines? (\d+)(?:--(\d+))?', match[0])
                  context = ''
                  if span:
                      lo, hi = int(span[1]), int(span[2] or span[1])
                      context = '\n'.join(tex[max(0, lo - 3):min(len(tex), hi + 2)])
                  if re.search(r'Teichholz|echocardiographic-angiographic', record + context, re.I):
                      target.append(match[0])
                  complete.append(f'Log, línea {log.count(chr(10), 0, match.start()) + 1}\n{record}'
                                  + (f'\nFuente TeX:\n{context}' if context else ''))
              (out / f'cajas-{modo}.txt').write_text(
                  f'{modo}: {count} páginas, {len(complete)} avisos.\n'
                  + '\n'.join(f'{name}: {stats[name]}' for name in
                              ('Overfull hbox', 'Overfull vbox', 'Underfull hbox', 'Underfull vbox'))
                  + '\n\n' + '\n\n'.join(complete) + '\n', encoding='utf-8')
              report[modo] = dict(paginas=count, cajas=dict(stats), teichholz=target)
              print(modo, report[modo], flush=True)
          with tempfile.TemporaryDirectory() as temp:
              root = Path(temp)
              def render(task):
                  modo, lo, hi = task
                  directory = root / modo
                  directory.mkdir(exist_ok=True)
                  subprocess.run(['pdftoppm', '-r', '150', '-f', str(lo), '-l', str(hi),
                                  '-png', str(out / f'{modo}.pdf'), str(directory / 'pagina')], check=True)

              tasks = [(modo, lo, min(lo + 65, report[modo]['paginas']))
                       for modo in ('antes', 'despues')
                       for lo in range(1, report[modo]['paginas'] + 1, 66)]
              with ThreadPoolExecutor(max_workers=4) as pool:
                  list(pool.map(render, tasks))
              def hashes(modo):
                  result = {int(f.stem.split('-')[-1]): sha256(f.read_bytes()).hexdigest()
                            for f in (root / modo).glob('*.png')}
                  assert set(result) == set(range(1, report[modo]['paginas'] + 1))
                  return result
              a, b = hashes('antes'), hashes('despues')
              report['paginas_distintas_150dpi'] = [p for p in sorted(a.keys() | b.keys()) if a.get(p) != b.get(p)]
          (out / 'resultado.json').write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n',
                                             encoding='utf-8')
          print(json.dumps(report, ensure_ascii=False))
          PY

      - name: Conservar ambos PDF y el inventario de cajas
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: auditoria-silabacion-pdf
          path: build/auditoria-silabacion/
          retention-days: 30
