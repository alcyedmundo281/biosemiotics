name: EPUB y LuaLaTeX del atlas

# Genera automáticamente EPUB, PDF y fuente LuaLaTeX autocontenida cuando
# cambia main. Los binarios no viven en git: cada ejecución los publica como
# artifact descargable, y los releases además los reciben como assets.
#
# CONTRATO CON scripts/epub.py
# Este workflow define la interfaz que debe cumplir el generador:
#   · se invoca como `python scripts/epub.py --salida <ruta>`
#   · deja el archivo exactamente en esa ruta
#   · sale con código != 0 si algo falló, incluida su propia validación
# Si el generador cambia de toolchain, hay que actualizar el paso «Instalar
# dependencias del sistema» de aquí abajo. Esa actualización es parte del
# trabajo de quien cambie el generador.
#
# MOTOR DE RENDER
# El manuscrito lo proyecta `scripts/qmd.py` a un proyecto Quarto book en
# build/quarto/. `epub.py` prefiere `quarto` y cae a `pandoc` sobre el
# manuscrito plano equivalente si no lo encuentra. Aquí se instalan los dos a
# propósito: si la instalación de Quarto falla, el EPUB igual se produce y la
# validación editorial sigue siendo la misma.
#
# AVISO SOBRE ZENODO
# La integración de Zenodo con GitHub archiva el SNAPSHOT DEL REPOSITORIO al
# crear el release, no los assets. El .epub adjunto aquí NO entra solo en el
# registro de Zenodo: para que el ePub quede dentro del DOI hay que subirlo al
# registro (a mano o vía API). Lo que sí queda archivado y citable es la fuente
# que lo genera, que es reproducible por diseño.

on: workflow_dispatch

permissions:
  contents: read

concurrency:
  group: editorial-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  epub:
    name: Generar EPUB, PDF y fuente LuaLaTeX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 9ff8f47899a54a1791df91356c55f1b3b8882fcb
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Instalar dependencias de Python
        run: pip install -r requirements.txt

      - name: Comprobar que el generador existe
        # Falla con un mensaje accionable en vez de un ModuleNotFound críptico.
        run: |
          if [ ! -f scripts/epub.py ]; then
            echo "::error::Falta scripts/epub.py."
            echo "El generador de ePub todavía no está en el repositorio."
            echo "Interfaz esperada: python scripts/epub.py --salida build/atlas.epub"
            exit 1
          fi

      - name: Instalar dependencias del sistema
        # Pandoc genera el EPUB y LuaLaTeX compila el libro con las mismas
        # imágenes declaradas en `archivo_local`.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pandoc fonts-freefont-ttf default-jre-headless librsvg2-bin \
            texlive-latex-recommended texlive-latex-extra \
            texlive-bibtex-extra texlive-lang-spanish texlive-luatex
          echo "pandoc: $(pandoc --version | head -1)"
          # rsvg-convert rasteriza la portada: Kindle no admite portadas SVG
          # y Calibre no puede extraerlas sin motor de navegador.
          echo "rsvg-convert: $(rsvg-convert --version)"
          echo "lualatex: $(lualatex --version | head -1)"

      - name: Instalar Libertinus
        # Fuente del libro impreso (serif, sans y display; cubre ≥ → ±).
        # Ubuntu 24.04 no la empaqueta: se fija la versión, como epubcheck.
        run: |
          VER=7.051
          curl -fsSL -o /tmp/libertinus.zip \
            "https://github.com/alerque/libertinus/releases/download/v${VER}/Libertinus-${VER}.zip"
          unzip -q /tmp/libertinus.zip -d /tmp/libertinus
          mkdir -p ~/.local/share/fonts
          find /tmp/libertinus -name 'Libertinus*.otf' -exec cp {} ~/.local/share/fonts/ \;
          fc-cache -f
          for familia in "Libertinus Serif" "Libertinus Sans" "Libertinus Serif Display"; do
            fc-list | grep -q "$familia" || { echo "::error::Falta la fuente $familia"; exit 1; }
          done

      - name: Instalar Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.5.57

      - name: Instalar epubcheck
        run: |
          VER=5.1.0
          curl -fsSL -o /tmp/epubcheck.zip \
            "https://github.com/w3c/epubcheck/releases/download/v${VER}/epubcheck-${VER}.zip"
          unzip -q /tmp/epubcheck.zip -d /opt
          echo "EPUBCHECK_JAR=/opt/epubcheck-${VER}/epubcheck.jar" >> "$GITHUB_ENV"

      - name: Comparar el corte por hash con procedencia fija
        run: |
          sudo apt-get install -y --no-install-recommends poppler-utils
          commit=$(git rev-parse HEAD)
          git show -s --format='Commit %H%nSOURCE_DATE_EPOCH %ct' HEAD
          git tag auditoria-corte "$commit"
          out="$GITHUB_WORKSPACE/build/auditoria-hash"
          mkdir -p "$out"
          cat > "$RUNNER_TEMP/auditar_corte.py" <<'PY'
          from pathlib import Path
          import sys

          sys.path.insert(0, str(Path.cwd() / 'scripts'))
          import banco
          import libro
          import qmd

          modo, salida = sys.argv[1:]
          if modo == 'con_futura':
              Path('conceptos/auditoria-futura.qmd').write_text(
                  '---\nid: auditoria-futura\ntipo: concepto\ntitulo: FICHA FICTICIA POSTERIOR\n'
                  'estado: publicado\nnumero: 57\nvolumen: 1\n'
                  'ghost_id: abcdef0123456789abcdef01\n'
                  'url: "https://example.org/auditoria-futura/"\n'
                  'fecha_publicacion: "2026-11-20T12:00:00.000+00:00"\n'
                  '---\nEsta ficha ficticia no puede entrar en el libro.\n', encoding='utf-8')
          if modo == 'sin_filtro':
              banco.seleccionar_edicion = lambda entidades, _: banco.seleccionar_publicables(entidades, True)

          version, entorno = qmd.compilacion_git(Path.cwd())
          assert version == 'auditoria-corte' and entorno['SOURCE_DATE_EPOCH'] and entorno['TZ'] == 'UTC'
          entidades = banco.cargar(Path.cwd())
          libro_entidades = banco.seleccionar_edicion(entidades, qmd.FECHA_CORTE)
          seriado = banco.seleccionar_publicables(entidades, True)
          assert len(libro_entidades) == 56
          assert len(seriado) == (57 if modo == 'con_futura' else 56)
          assert not any(e['id'] == 'auditoria-futura' for e in libro_entidades)
          print(f'{modo}: {len(libro_entidades)} fichas en el libro; {len(seriado)} en el seriado; {version}; epoch {entorno["SOURCE_DATE_EPOCH"]}', flush=True)
          sys.argv = ['libro.py', '--solo-publicados', '--salida', salida]
          raise SystemExit(libro.main())
          PY
          for modo in sin_filtro con_filtro con_futura; do
            checkout="$RUNNER_TEMP/corte-$modo"
            git worktree add --detach "$checkout" "$commit"
            (
              cd "$checkout"
              env -u GITHUB_ACTIONS -u SOURCE_DATE_EPOCH \
                python "$RUNNER_TEMP/auditar_corte.py" "$modo" "$out/$modo.pdf"
            )
            pdfinfo "$out/$modo.pdf" | awk '/^Pages:/ { print; if ($2 != 264) exit 1; ok=1 } END { if (!ok) exit 1 }'
          done
          sha256sum "$out"/*.pdf | tee "$out/sha256.txt"
          cmp "$out/sin_filtro.pdf" "$out/con_filtro.pdf"
          cmp "$out/con_filtro.pdf" "$out/con_futura.pdf"
          echo 'Los tres PDF son idénticos byte por byte.'

      - name: Conservar evidencia de la auditoría
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: auditoria-hash-corte
          path: build/auditoria-hash/
          retention-days: 14
