<div id="retoWrap" style="margin:0 auto">
  <iframe id="retoFrame"
          title="Reto — biosemiotics"
          width="100%" height="620" frameborder="0" loading="lazy"
          style="border:1px solid #DFE3E6;border-radius:6px;display:block;">
  </iframe>
  <noscript>
    <p style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:#8A9199">
      El reto necesita JavaScript.
      <a href="https://www.biosemiotics.net/atlas/">Ir al atlas</a>
    </p>
  </noscript>
</div>

<script>
(function(){
  // El parámetro ?signo= llega a ESTA página, no al iframe: su src es fijo.
  // Hay que leerlo aquí y reenviarlo antes de cargar el marco.
  var ORIGEN = "https://alcyedmundo281.github.io";
  var BASE   = ORIGEN + "/biosemiotics/artefactos/reto.html";

  var frame = document.getElementById("retoFrame");
  if (!frame) return;

  var m = /[?&]signo=([^&]+)/.exec(window.location.search);
  var src = BASE;

  if (m) {
    // Reenviar solo ids con la forma esperada. Evita inyectar cualquier cosa
    // que venga en la URL. Se permiten letras acentuadas y ñ: los ids del banco
    // las usan (signo-riñon-cronico).
    var id = decodeURIComponent(m[1]);
    if (/^[a-z0-9áéíóúñü-]{3,60}$/i.test(id)) {
      src += "?signo=" + encodeURIComponent(id);
    }
  }

  frame.src = src;

  // El contenido cambia de alto según el estado del juego. Sin esto, en móvil
  // queda un marco con scroll interno.
  window.addEventListener("message", function(e){
    if (e.origin !== ORIGEN) return;
    if (e.data && e.data.tipo === "alto-reto") {
      var h = parseInt(e.data.alto, 10);
      if (h > 200 && h < 4000) frame.style.height = h + "px";
    }
  });
})();
</script>
